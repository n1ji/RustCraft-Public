[workspace]
resolver = "2"
members = [
    "crates/game",
    "crates/renderer",
    "crates/renderer/backend/dx12",
    "crates/renderer/backend/vulkan",
]
default-members = ["crates/game"]

[profile.dev]
# Keep debug symbols and assertions, but make the normal development binary
# representative enough for frame-pacing measurements.
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
