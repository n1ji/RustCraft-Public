[package]
name = "rustcraft-game"
version = "1.0.0"
edition = "2021"
build = "build.rs"
default-run = "rustcraft"

[[bin]]
name = "rustcraft"
path = "src/main.rs"

[dependencies]
winit = { version = "0.30", features = ["serde"] }
nalgebra = "0.32"
image = "0.25"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdue = "0.9"
flate2 = "1"
rodio = "0.19"
zip = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
aes = "0.8"
rsa = "0.9"
sha1 = "0.10"
fnv = "1.0.7"
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }
gilrs = "0.11"
renderer = { package = "rustcraft-renderer", path = "../renderer" }
renderer_vulkan = { package = "rustcraft-renderer-vulkan", path = "../renderer/backend/vulkan" }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
renderer_dx12 = { package = "rustcraft-renderer-dx12", path = "../renderer/backend/dx12" }

[build-dependencies]
embed-resource = "2.3"
